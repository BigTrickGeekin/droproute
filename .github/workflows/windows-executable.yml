name: Windows executable

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[build]"
      - name: Build
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --name DropRoute
          --collect-all watchdog src/droproute/cli.py
      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item .\dist\DropRoute.exe .\package\DropRoute.exe
          Copy-Item .\config.example.json .\package\config.example.json
          Copy-Item .\README.md .\package\README.md
          Copy-Item .\LICENSE .\package\LICENSE
          Compress-Archive -Path .\package\* -DestinationPath .\DropRoute-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DropRoute-Windows
          path: DropRoute-Windows.zip
